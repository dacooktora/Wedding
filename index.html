<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Wedding Budget Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1e;
            color: #eef5ff;
            padding: 16px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* Header */
        .hero {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #3bc9ff, #a970ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .target-card {
            background: rgba(15, 25, 45, 0.9);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-left: 4px solid #2dd4bf;
        }
        
        .target-card input {
            background: #07131f;
            border: 1px solid #2c4c6c;
            padding: 8px 12px;
            border-radius: 40px;
            color: white;
            flex: 1;
            min-width: 120px;
        }
        
        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .kpi-card {
            background: rgba(8, 18, 32, 0.9);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(59, 201, 255, 0.3);
        }
        
        .kpi-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.7;
        }
        
        .kpi-value {
            font-size: 1.3rem;
            font-weight: 800;
            word-break: break-word;
        }
        
        /* Charts Row - scroll horizontal biar ga ngeleg */
        .charts-wrapper {
            overflow-x: auto;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .charts-row {
            display: flex;
            gap: 16px;
            min-width: min-content;
        }
        
        .chart-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 12px;
            width: 280px;
            flex-shrink: 0;
        }
        
        .chart-box canvas {
            max-height: 180px;
            width: 100% !important;
        }
        
        /* Table Container - scroll horizontal */
        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .data-table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        
        .data-table th {
            background: #0e1a2b;
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            color: #aad0ff;
        }
        
        .data-table td {
            padding: 8px;
            border-bottom: 1px solid #2a3a4e;
            background: rgba(10, 20, 35, 0.7);
        }
        
        [contenteditable="true"] {
            background: #0f212f;
            border-radius: 6px;
            padding: 4px 6px;
            display: inline-block;
            min-width: 60px;
        }
        
        .action-icons i {
            margin: 0 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        /* Buttons */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-futur {
            background: #0e2a3b;
            border: 1px solid #3bc9ff;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-futur:active {
            transform: scale(0.97);
        }
        
        /* Progress */
        .progress-section {
            background: rgba(7, 19, 31, 0.9);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .progress-bar-bg {
            background: #1a2c3e;
            border-radius: 30px;
            height: 24px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2dd4bf, #3b82f6);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .sync-badge {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #0a1f2c;
            border-radius: 30px;
            padding: 4px 10px;
            font-size: 0.6rem;
            border: 1px solid cyan;
            z-index: 999;
        }
        
        footer {
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.5;
            margin-top: 20px;
        }
        
        @media (min-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(4, 1fr); }
            .charts-row { flex-wrap: wrap; justify-content: center; }
            .chart-box { width: 380px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1><i class="fas fa-chart-line"></i> Wedding Budget Sync</h1>
        <div class="target-card">
            <i class="fas fa-bullseye fa-lg" style="color:#2dd4bf"></i>
            <span style="font-size:0.8rem;">TARGET NIKAH:</span>
            <strong id="displayTarget">Rp 0</strong>
            <input type="number" id="targetInput" placeholder="Total target" value="75000000">
            <button class="btn-futur" id="updateTargetBtn" style="padding: 6px 12px;">Set</button>
        </div>
    </div>
    
    <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">💰 TERKUMPUL</div><div class="kpi-value" id="totalIncome">Rp 0</div></div>
        <div class="kpi-card"><div class="kpi-label">💸 TERPAKAI</div><div class="kpi-value" id="totalExpense">Rp 0</div></div>
        <div class="kpi-card"><div class="kpi-label">⚖️ SISA</div><div class="kpi-value" id="balance">Rp 0</div></div>
        <div class="kpi-card"><div class="kpi-label">🎯 CAPAI</div><div class="kpi-value" id="targetPercent">0%</div></div>
    </div>
    
    <div class="charts-wrapper">
        <div class="charts-row">
            <div class="chart-box"><h3 style="font-size:0.9rem;"><i class="fas fa-chart-pie"></i> Kategori</h3><canvas id="categoryPieChart"></canvas></div>
            <div class="chart-box"><h3 style="font-size:0.9rem;"><i class="fas fa-chart-line"></i> Target</h3><canvas id="targetGaugeChart"></canvas></div>
            <div class="chart-box"><h3 style="font-size:0.9rem;"><i class="fas fa-chart-bar"></i> Income vs Expense</h3><canvas id="incomeExpenseBarChart"></canvas></div>
        </div>
    </div>
    
    <div class="progress-section">
        <div style="display: flex; justify-content: space-between;">
            <span><i class="fas fa-flag-checkered"></i> PROGRESS KE TARGET</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-fill" id="milestoneFill">0%</div></div>
        <div id="cheerMessage" style="margin-top: 8px; font-size:0.75rem;"></div>
    </div>
    
    <div class="table-container">
        <table class="data-table">
            <thead><tr><th>Tanggal</th><th>Deskripsi</th><th>Kategori</th><th>Tipe</th><th>Jumlah (Rp)</th><th>Aksi</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    
    <div class="button-group">
        <button class="btn-futur" id="addRowBtn"><i class="fas fa-plus"></i> Tambah</button>
        <button class="btn-futur" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Export</button>
        <button class="btn-futur" id="resetSampleBtn"><i class="fas fa-database"></i> Reset Sample</button>
    </div>
    <footer>✨ Double klik sel untuk edit | Real-time sync dengan pasangan</footer>
</div>
<div class="sync-badge"><i class="fas fa-cloud-upload-alt"></i> Live Sync</div>

<script>
    // ==================== 🔥 GANTI DENGAN CONFIG FIREBASE KAMU 🔥 ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDE1rDGnRJ-S38Qsu7lTUYKUG1fzJhWpRc",
        authDomain: "wedding-26918.firebaseapp.com",
        databaseURL: "https://wedding-26918-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wedding-26918",
        storageBucket: "wedding-26918.firebasestorage.app",
        messagingSenderId: "156173019796",
        appId: "1:156173019796:web:bc23f9a7be015a9d4f6281"
    };
    // =======================================================================
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    let transactions = [];
    let targetAmount = 75000000;
    let isLoadingFromFirebase = false;
    let charts = { pie: null, gauge: null, bar: null };
    
    function formatRp(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }
    
    function calcTotals() {
        let income = transactions.filter(t => t.type === 'Pemasukan').reduce((s, c) => s + c.amount, 0);
        let expense = transactions.filter(t => t.type === 'Pengeluaran').reduce((s, c) => s + c.amount, 0);
        return { income, expense };
    }
    
    function renderTable() {
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (transactions.length === 0) {
            let row = tbody.insertRow();
            let cell = row.insertCell(0);
            cell.colSpan = 6;
            cell.innerText = "Klik 'Tambah' atau 'Reset Sample' untuk mulai";
            cell.style.textAlign = 'center';
            return;
        }
        transactions.forEach((t, idx) => {
            let row = tbody.insertRow();
            row.insertCell(0).innerText = t.date || '';
            row.insertCell(1).innerText = t.desc || '';
            row.insertCell(2).innerText = t.category || '';
            row.insertCell(3).innerText = t.type || '';
            row.insertCell(4).innerText = formatRp(t.amount || 0);
            let actionCell = row.insertCell(5);
            actionCell.className = "action-icons";
            actionCell.innerHTML = `<i class="fas fa-trash-alt" onclick="deleteTransaction(${idx})"></i> <i class="fas fa-copy" onclick="duplicateTransaction(${idx})"></i>`;
            
            // Make cells editable
            for (let i = 0; i < 4; i++) {
                let cell = row.cells[i];
                cell.contentEditable = "true";
                cell.addEventListener('blur', (function(index, field) {
                    return function(e) {
                        let newVal = e.target.innerText;
                        updateTransactionField(index, field, newVal);
                    };
                })(idx, i));
            }
            // Amount cell special
            let amountCell = row.cells[4];
            amountCell.contentEditable = "true";
            amountCell.addEventListener('blur', (function(index) {
                return function(e) {
                    let raw = e.target.innerText.replace(/[^0-9.-]/g, '');
                    let num = parseFloat(raw);
                    if (!isNaN(num)) updateTransactionField(index, 'amount', num);
                };
            })(idx));
        });
    }
    
    function updateTransactionField(idx, field, value) {
        if (field === 0) transactions[idx].date = value;
        else if (field === 1) transactions[idx].desc = value;
        else if (field === 2) transactions[idx].category = value;
        else if (field === 3) transactions[idx].type = value;
        else if (field === 'amount') transactions[idx].amount = value;
        refreshUI();
    }
    
    window.deleteTransaction = (idx) => { transactions.splice(idx, 1); refreshUI(); };
    window.duplicateTransaction = (idx) => { transactions.push({...transactions[idx]}); refreshUI(); };
    
    function refreshUI() {
        if (isLoadingFromFirebase) return;
        let { income, expense } = calcTotals();
        let balance = income - expense;
        let percent = Math.min(100, (income / targetAmount) * 100);
        
        document.getElementById('totalIncome').innerText = formatRp(income);
        document.getElementById('totalExpense').innerText = formatRp(expense);
        document.getElementById('balance').innerText = formatRp(balance);
        document.getElementById('targetPercent').innerText = Math.floor(percent) + '%';
        document.getElementById('displayTarget').innerText = formatRp(targetAmount);
        
        let fill = document.getElementById('milestoneFill');
        fill.style.width = percent + '%';
        fill.innerText = Math.floor(percent) + '%';
        document.getElementById('progressText').innerText = Math.floor(percent) + '%';
        
        let cheer = document.getElementById('cheerMessage');
        if (income >= targetAmount) cheer.innerHTML = '🎉 SELAMAT! TARGET TERCAPAI! 🎉';
        else cheer.innerHTML = `💪 Butuh ${formatRp(targetAmount - income)} lagi ke target.`;
        
        renderTable();
        updateCharts();
        saveToFirebase();
    }
    
    function updateCharts() {
        // Pie chart (pengeluaran per kategori)
        let expenses = transactions.filter(t => t.type === 'Pengeluaran');
        let catMap = new Map();
        expenses.forEach(e => catMap.set(e.category, (catMap.get(e.category)||0) + e.amount));
        
        if (charts.pie) charts.pie.destroy();
        let pieCtx = document.getElementById('categoryPieChart').getContext('2d');
        charts.pie = new Chart(pieCtx, {
            type: 'pie',
            data: { labels: Array.from(catMap.keys()), datasets: [{ data: Array.from(catMap.values()), backgroundColor: ['#3bc9ff','#a970ff','#ffb347','#2dd4bf','#ff6b6b'] }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }
        });
        
        // Gauge
        let income = transactions.filter(t=>t.type==='Pemasukan').reduce((a,b)=>a+b.amount,0);
        let percent = Math.min(100, (income/targetAmount)*100);
        if (charts.gauge) charts.gauge.destroy();
        let gaugeCtx = document.getElementById('targetGaugeChart').getContext('2d');
        charts.gauge = new Chart(gaugeCtx, {
            type: 'doughnut',
            data: { labels: ['Tercapai', 'Sisa'], datasets: [{ data: [percent, 100-percent], backgroundColor: ['#2dd4bf','#2c3e56'], cutout: '65%' }] }
        });
        
        // Bar chart
        let totalIncome = income;
        let totalExp = transactions.filter(t=>t.type==='Pengeluaran').reduce((a,b)=>a+b.amount,0);
        if (charts.bar) charts.bar.destroy();
        let barCtx = document.getElementById('incomeExpenseBarChart').getContext('2d');
        charts.bar = new Chart(barCtx, {
            type: 'bar',
            data: { labels: ['Pemasukan', 'Pengeluaran'], datasets: [{ label: 'Rp', data: [totalIncome, totalExp], backgroundColor: ['#3bc9ff','#ff6b6b'] }] },
            options: { responsive: true, maintainAspectRatio: true, scales: { y: { ticks: { callback: v => v/1e6 + 'jt' } } } }
        });
    }
    
    function saveToFirebase() {
        if (isLoadingFromFirebase) return;
        database.ref('weddingData').set({
            transactions: transactions,
            targetAmount: targetAmount,
            updated: Date.now()
        }).catch(e => console.warn(e));
    }
    
    function loadFromFirebase() {
        isLoadingFromFirebase = true;
        database.ref('weddingData').once('value').then(snap => {
            let data = snap.val();
            if (data && data.transactions) {
                transactions = data.transactions;
                targetAmount = data.targetAmount || 75000000;
            } else {
                // sample data
                transactions = [
                    { date: "2025-05-01", desc: "Gaji", category: "Pendapatan", type: "Pemasukan", amount: 20000000 },
                    { date: "2025-05-03", desc: "DP Venue", category: "Venue", type: "Pengeluaran", amount: 8000000 },
                    { date: "2025-05-10", desc: "Fotografer", category: "Dokumentasi", type: "Pengeluaran", amount: 5000000 }
                ];
                targetAmount = 75000000;
            }
            isLoadingFromFirebase = false;
            refreshUI();
        }).catch(() => { isLoadingFromFirebase = false; refreshUI(); });
    }
    
    function listenRealtime() {
        database.ref('weddingData').on('value', snap => {
            if (isLoadingFromFirebase) return;
            let data = snap.val();
            if (data && data.transactions) {
                transactions = data.transactions;
                targetAmount = data.targetAmount || 75000000;
                refreshUI();
            }
        });
    }
    
    // actions
    document.getElementById('addRowBtn').onclick = () => {
        transactions.push({ date: new Date().toISOString().slice(0,10), desc: "Baru", category: "Lainnya", type: "Pengeluaran", amount: 0 });
        refreshUI();
    };
    document.getElementById('exportExcelBtn').onclick = () => {
        let wsData = [["Tanggal","Deskripsi","Kategori","Tipe","Jumlah"]];
        transactions.forEach(t => wsData.push([t.date, t.desc, t.category, t.type, t.amount]));
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsData), "Wedding");
        XLSX.writeFile(wb, `wedding_${new Date().toISOString().slice(0,10)}.xlsx`);
    };
    document.getElementById('resetSampleBtn').onclick = () => {
        transactions = [
            { date: "2025-05-01", desc: "Gaji + Bonus", category: "Pendapatan", type: "Pemasukan", amount: 25000000 },
            { date: "2025-05-05", desc: "Catering", category: "Konsumsi", type: "Pengeluaran", amount: 7000000 },
            { date: "2025-05-08", desc: "Dekorasi", category: "Dekorasi", type: "Pengeluaran", amount: 5000000 }
        ];
        targetAmount = 75000000;
        refreshUI();
    };
    document.getElementById('updateTargetBtn').onclick = () => {
        let newTarget = parseFloat(document.getElementById('targetInput').value);
        if (!isNaN(newTarget) && newTarget > 0) targetAmount = newTarget;
        refreshUI();
    };
    
    // Start
    loadFromFirebase();
    listenRealtime();
</script>
</body>
</html>
